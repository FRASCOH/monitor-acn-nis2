<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACN NIS2 Monitor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --modal-bg: rgba(15, 23, 42, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .last-update {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse 2s infinite;
        }

        /* Filter Controls */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease;
        }

        .filter-row {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 0.8rem 1.5rem;
            padding-left: 3rem;
            border-radius: 2rem;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* Atti List View */
        .atti-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .atti-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.2rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .atti-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .atti-name {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            flex: 1;
            padding-right: 1.5rem;
        }

        .atti-actions {
            display: flex;
            gap: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        /* Sub-filters for Atti */
        .sub-filters {
            display: none; /* Show only when 'atti' is selected */
            justify-content: center;
            gap: 1rem;
            margin-top: -1rem;
            margin-bottom: 2rem;
            animation: fadeIn 0.5s ease;
        }

        .select-filter {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .select-filter:focus {
            border-color: var(--primary);
        }

        .select-filter option {
            background: var(--bg);
            color: var(--text);
        }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out backwards;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            opacity: 0.5;
        }

        .card.has-changes::before {
            background: var(--warning);
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            margin: 0;
            line-height: 1.4;
            flex: 1;
            /* Gestione titoli lunghi: max 2 righe poi ellipsis */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-badge {
            padding: 0.3rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .status-badge.status-ok {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge.status-mod {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.1);
            animation: pulse-warning 2s infinite;
        }

        .status-badge.status-err {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        @keyframes pulse-warning {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card-body {
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .check-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .summary-text {
            font-size: 0.95rem;
            color: var(--text);
            min-height: 1.5rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            text-align: center;
            flex: 1;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            background: var(--primary);
        }

        /* Modal Styles */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        #modal {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover { color: var(--text); }

        .modal-content {
            padding: 2rem;
            overflow-y: auto;
        }

        .diff-section { margin-bottom: 2rem; }
        .diff-section h3 { 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }
        .diff-add h3 { color: var(--success); }
        .diff-rem h3 { color: var(--danger); }

        .diff-item {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .item-add {
            background: rgba(34, 197, 94, 0.1);
            border-left-color: var(--success);
        }

        .item-rem {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: var(--danger);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            text-align: center;
            padding: 5rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
            #modal { max-height: 95vh; }
            .controls { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Monitor ACN NIS2</h1>
            <div id="header-info" class="last-update">
                <span class="pulse-dot"></span>
                <span>In attesa dei dati...</span>
            </div>
        </header>

        <div class="controls">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Cerca tra documenti, stati o contenuti..." oninput="handleSearch()">
            </div>
            <div class="filter-row">
                <button class="filter-btn active" onclick="setFilter('all', this)">Tutti</button>
                <button class="filter-btn" onclick="setFilter('pages', this)">Pagine Web</button>
                <button class="filter-btn" onclick="setFilter('pdfs', this)">Documenti PDF</button>
                <button class="filter-btn" onclick="setFilter('atti', this)">Registro Atti</button>
            </div>
            
            <div id="sub-filters" class="sub-filters">
                <select id="type-filter" class="select-filter" onchange="renderDashboard()">
                    <option value="all">Tutti i tipi</option>
                </select>
                <select id="year-filter" class="select-filter" onchange="renderDashboard()">
                    <option value="all">Tutti gli anni</option>
                </select>
            </div>
        </div>

        <div id="dashboard-grid" class="grid">
            <div class="loader">Caricamento in corso...</div>
        </div>
    </div>

    <!-- Modal for Changes -->
    <div id="modal-overlay">
        <div id="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-page-name">Dettaglio Modifiche</div>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <div class="modal-content" id="modal-body">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let currentFilter = 'all';
        let searchQuery = '';

        async function fetchStatus() {
            try {
                const response = await fetch('status.json?t=' + new Date().getTime());
                const data = await response.json();
                currentData = data;
                renderDashboard();
            } catch (error) {
                document.getElementById('dashboard-grid').innerHTML = `
                    <div class="loader" style="color: var(--danger)">
                        Errore nel caricamento dei dati. Assicurati che status.json sia presente.
                    </div>
                `;
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.toLowerCase();
            renderDashboard();
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Show/hide sub-filters for Atti
            const subFilters = document.getElementById('sub-filters');
            if (filter === 'atti') {
                subFilters.style.display = 'flex';
                populateSubFilters();
            } else {
                subFilters.style.display = 'none';
            }
            
            renderDashboard();
        }

        function populateSubFilters() {
            const attiPage = currentData.pages.find(p => p.id === 'atti_generali');
            const attiList = attiPage ? attiPage.atti_list : [];
            
            if (!attiList || attiList.length === 0) return;

            const typeFilter = document.getElementById('type-filter');
            const yearFilter = document.getElementById('year-filter');
            
            const currentType = typeFilter.value;
            const currentYear = yearFilter.value;

            // Unique types and years
            const types = [...new Set(attiList.map(a => a.type).filter(Boolean))].sort();
            const years = [...new Set(attiList.map(a => a.year).filter(Boolean))].sort((a,b) => b-a);

            typeFilter.innerHTML = '<option value="all">Tutti i tipi</option>' + 
                types.map(t => `<option value="${t}">${t}</option>`).join('');
            
            yearFilter.innerHTML = '<option value="all">Tutti gli anni</option>' + 
                years.map(y => `<option value="${y}">${y}</option>`).join('');

            // Restore selection if still valid
            if (types.includes(currentType)) typeFilter.value = currentType;
            if (years.includes(currentYear)) yearFilter.value = currentYear;
        }

        function renderDashboard() {
            if (!currentData) return;

            const headerInfo = document.getElementById('header-info');
            headerInfo.innerHTML = `
                <span class="pulse-dot"></span>
                <span>Ultimo controllo globale: <strong>${currentData.last_update}</strong></span>
            `;

            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = '';

            // Se il filtro è 'atti', mostriamo la lista documenti speciale
            if (currentFilter === 'atti') {
                grid.className = 'atti-list';
                
                const attiPage = currentData.pages.find(p => p.id === 'atti_generali');
                const attiList = attiPage ? attiPage.atti_list : [];

                if (!attiList || attiList.length === 0) {
                    grid.innerHTML = '<div class="empty-state">Nessun atto amministrativo trovato o lista in fase di caricamento...</div>';
                    return;
                }

                const selectedType = document.getElementById('type-filter').value;
                const selectedYear = document.getElementById('year-filter').value;

                // Applichiamo i filtri (ricerca + tipo + anno)
                const filteredAtti = attiList.filter(a => {
                    const matchesSearch = !searchQuery || a.name.toLowerCase().includes(searchQuery);
                    const matchesType = selectedType === 'all' || a.type === selectedType;
                    const matchesYear = selectedYear === 'all' || a.year === selectedYear;
                    return matchesSearch && matchesType && matchesYear;
                });

                if (filteredAtti.length === 0) {
                    grid.innerHTML = '<div class="empty-state">Nessun documento corrisponde ai filtri selezionati.</div>';
                    return;
                }

                filteredAtti.forEach(atto => {
                    const item = document.createElement('div');
                    item.className = 'atti-item';
                    item.innerHTML = `
                        <div style="flex: 1;">
                            <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.3rem;">
                                <span class="status-badge" style="background: rgba(99, 102, 241, 0.1); color: var(--primary); border: 1px solid rgba(99, 102, 241, 0.2);">${atto.type}</span>
                                ${atto.date ? `<span style="font-size: 0.8rem; color: var(--text-muted);">${atto.date}</span>` : ''}
                            </div>
                            <div class="atti-name">${atto.name}</div>
                        </div>
                        <div class="atti-actions">
                            <a href="${atto.url}" target="_blank" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.8rem;">Apri Atto</a>
                        </div>
                    `;
                    grid.appendChild(item);
                });
                return;
            }

            // Layout standard a Card
            grid.className = 'grid';
            
            const filteredPages = currentData.pages.filter(page => {
                const isPdf = page.name.includes('📄');
                
                // Filtro categoria
                let passFilter = true;
                if (currentFilter === 'pages') passFilter = !isPdf;
                else if (currentFilter === 'pdfs') passFilter = isPdf;
                
                if (!passFilter) return false;

                // Filtro ricerca
                if (searchQuery) {
                    const searchContent = (page.name + ' ' + page.status + ' ' + (page.summary || '')).toLowerCase();
                    return searchContent.includes(searchQuery);
                }

                return true;
            });

            if (filteredPages.length === 0) {
                grid.innerHTML = '<div class="loader">Nessun elemento trovato per questo filtro.</div>';
                return;
            }

            filteredPages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = `card ${page.has_changes ? 'has-changes' : ''}`;
                card.style.animationDelay = `${index * 0.05}s`;

                let statusClass = 'status-ok';
                let statusLabel = '✓ OK';
                
                if (page.status === 'Modificato' || page.status === 'Modificato (Recente)') {
                    statusClass = 'status-mod';
                    statusLabel = '🔔 Modificato';
                } else if (page.status.includes('Errore')) {
                    statusClass = 'status-err';
                    statusLabel = '⚠️ Errore';
                }

                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title" title="${page.name}">${page.name}</h3>
                        <span class="status-badge ${statusClass}">${statusLabel}</span>
                    </div>
                    <div class="card-body">
                        <div class="check-info">Controllato il: ${page.last_check}</div>
                        ${page.last_change_date ? `<div class="check-info" style="color: var(--warning)">Ultima modifica rilevata: ${page.last_change_date}</div>` : ''}
                        <div class="summary-text">${page.summary || 'Nessuna attività rilevata'}</div>
                    </div>
                    <div class="card-footer">
                        <a href="${page.url}" target="_blank" class="btn">Apri Pagina</a>
                        ${page.has_changes ? `<button onclick="showChanges('${page.name}')" class="btn btn-primary">Ultima Modifica</button>` : ''}
                        ${page.has_history ? `<button onclick="showHistory('${page.id}', '${page.name}')" class="btn" style="border-color: var(--secondary); color: var(--secondary);">Storico</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function showHistory(pageId, pageName) {
            const modalOverlay = document.getElementById('modal-overlay');
            const modalBody = document.getElementById('modal-body');
            const modalTitle = document.getElementById('modal-page-name');

            modalTitle.innerText = `Storico Modifiche: ${pageName}`;
            modalBody.innerHTML = '<div class="loader">Caricamento storico...</div>';
            modalOverlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            try {
                const response = await fetch(`archive/history_${pageId}.json?t=` + new Date().getTime());
                if (!response.ok) throw new Error("Storico non trovato");
                const history = await response.json();
                
                modalBody.innerHTML = '';
                
                if (history.length === 0) {
                    modalBody.innerHTML = '<p>Nessuna modifica registrata nello storico.</p>';
                    return;
                }

                history.forEach((entry, index) => {
                    const entryDiv = document.createElement('div');
                    entryDiv.style.marginBottom = '2rem';
                    entryDiv.style.paddingBottom = '2rem';
                    entryDiv.style.borderBottom = index < history.length - 1 ? '1px solid rgba(255,255,255,0.1)' : 'none';
                    
                    let html = `<h3 style="color: var(--primary); margin-bottom: 1rem;">📅 Modifica del ${entry.date_formatted}</h3>`;
                    
                    if (entry.additions && entry.additions.length > 0) {
                        html += `<div class="diff-section diff-add"><h4>✅ Aggiunte</h4>`;
                        entry.additions.forEach(text => {
                            html += `<div class="diff-item item-add">${text}</div>`;
                        });
                        html += `</div>`;
                    }
                    
                    if (entry.removals && entry.removals.length > 0) {
                        html += `<div class="diff-section diff-rem"><h4>❌ Rimozioni</h4>`;
                        entry.removals.forEach(text => {
                            html += `<div class="diff-item item-rem">${text}</div>`;
                        });
                        html += `</div>`;
                    }
                    
                    entryDiv.innerHTML = html;
                    modalBody.appendChild(entryDiv);
                });

            } catch (error) {
                modalBody.innerHTML = `<div class="loader" style="color: var(--danger)">Errore: Impossibile caricare lo storico.</div>`;
            }
        }

        function showChanges(pageName) {
            const page = currentData.pages.find(p => p.name === pageName);
            const modalOverlay = document.getElementById('modal-overlay');
            const modalBody = document.getElementById('modal-body');
            const modalTitle = document.getElementById('modal-page-name');

            modalTitle.innerText = page.name;
            modalBody.innerHTML = '';

            if (page.additions && page.additions.length > 0) {
                const addSection = document.createElement('div');
                addSection.className = 'diff-section diff-add';
                addSection.innerHTML = '<h3>✅ Aggiunte e Modifiche</h3>';
                page.additions.forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'diff-item item-add';
                    item.innerText = text;
                    addSection.appendChild(item);
                });
                modalBody.appendChild(addSection);
            }

            if (page.removals && page.removals.length > 0) {
                const remSection = document.createElement('div');
                remSection.className = 'diff-section diff-rem';
                remSection.innerHTML = '<h3>❌ Rimozioni</h3>';
                page.removals.forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'diff-item item-rem';
                    item.innerText = text;
                    remSection.appendChild(item);
                });
                modalBody.appendChild(remSection);
            }

            modalOverlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('close-modal').onclick = closeModal;
        document.getElementById('modal-overlay').onclick = (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        };

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Carica subito e poi ogni 60 secondi
        fetchStatus();
        setInterval(fetchStatus, 60000);
    </script>
</body>
</html>
