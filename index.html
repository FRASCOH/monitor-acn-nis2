<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACN NIS2 Monitor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --modal-bg: rgba(15, 23, 42, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .last-update {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse 2s infinite;
        }

        /* Filter Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            animation: fadeIn 1s ease;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out backwards;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            opacity: 0.5;
        }

        .card.has-changes::before {
            background: var(--warning);
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .page-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text);
            max-width: 80%;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 2rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .badge-none { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .badge-mod { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .badge-err { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        .card-body {
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .check-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .summary-text {
            font-size: 0.95rem;
            color: var(--text);
            min-height: 1.5rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            text-align: center;
            flex: 1;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            background: var(--primary);
        }

        /* Modal Styles */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        #modal {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            width: 100%;
            max-width: 800px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-modal:hover { color: var(--text); }

        .modal-content {
            padding: 2rem;
            overflow-y: auto;
        }

        .diff-section { margin-bottom: 2rem; }
        .diff-section h3 { 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }
        .diff-add h3 { color: var(--success); }
        .diff-rem h3 { color: var(--danger); }

        .diff-item {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
        }

        .item-add {
            background: rgba(34, 197, 94, 0.1);
            border-left-color: var(--success);
        }

        .item-rem {
            background: rgba(239, 68, 68, 0.1);
            border-left-color: var(--danger);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader {
            text-align: center;
            padding: 5rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
            #modal { max-height: 95vh; }
            .controls { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Monitor ACN NIS2</h1>
            <div id="header-info" class="last-update">
                <span class="pulse-dot"></span>
                <span>In attesa dei dati...</span>
            </div>
        </header>

        <div class="controls">
            <button class="filter-btn active" onclick="setFilter('all', this)">Tutti</button>
            <button class="filter-btn" onclick="setFilter('pages', this)">Pagine Web</button>
            <button class="filter-btn" onclick="setFilter('pdfs', this)">Documenti PDF</button>
        </div>

        <div id="dashboard-grid" class="grid">
            <div class="loader">Caricamento in corso...</div>
        </div>
    </div>

    <!-- Modal for Changes -->
    <div id="modal-overlay">
        <div id="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-page-name">Dettaglio Modifiche</div>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <div class="modal-content" id="modal-body">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let currentFilter = 'all';

        async function fetchStatus() {
            try {
                const response = await fetch('status.json?t=' + new Date().getTime());
                const data = await response.json();
                currentData = data;
                renderDashboard();
            } catch (error) {
                document.getElementById('dashboard-grid').innerHTML = `
                    <div class="loader" style="color: var(--danger)">
                        Errore nel caricamento dei dati. Assicurati che status.json sia presente.
                    </div>
                `;
            }
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDashboard();
        }

        function renderDashboard() {
            if (!currentData) return;

            const headerInfo = document.getElementById('header-info');
            headerInfo.innerHTML = `
                <span class="pulse-dot"></span>
                <span>Ultimo controllo globale: <strong>${currentData.last_update}</strong></span>
            `;

            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = '';

            const filteredPages = currentData.pages.filter(page => {
                const isPdf = page.name.includes('📄');
                if (currentFilter === 'pages') return !isPdf;
                if (currentFilter === 'pdfs') return isPdf;
                return true;
            });

            if (filteredPages.length === 0) {
                grid.innerHTML = '<div class="loader">Nessun elemento trovato per questo filtro.</div>';
                return;
            }

            filteredPages.forEach((page, index) => {
                const card = document.createElement('div');
                card.className = `card ${page.has_changes ? 'has-changes' : ''}`;
                card.style.animationDelay = `${index * 0.05}s`;

                const badgeClass = (page.status === 'Modificato' || page.status === 'Modificato (Recente)') ? 'badge-mod' : 
                                  (page.status.includes('Errore') ? 'badge-err' : 'badge-none');

                card.innerHTML = `
                    <div class="card-header">
                        <div class="page-name">${page.name}</div>
                        <div class="badge ${badgeClass}">${page.status}</div>
                    </div>
                    <div class="card-body">
                        <div class="check-info">Controllato il: ${page.last_check}</div>
                        ${page.last_change_date ? `<div class="check-info" style="color: var(--warning)">Ultima modifica rilevata: ${page.last_change_date}</div>` : ''}
                        <div class="summary-text">${page.summary || 'Nessuna attività rilevata'}</div>
                    </div>
                    <div class="card-footer">
                        <a href="${page.url}" target="_blank" class="btn">Apri Pagina</a>
                        ${page.has_changes ? `<button onclick="showChanges('${page.name}')" class="btn btn-primary">Vedi modifiche</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function showChanges(pageName) {
            const page = currentData.pages.find(p => p.name === pageName);
            const modalOverlay = document.getElementById('modal-overlay');
            const modalBody = document.getElementById('modal-body');
            const modalTitle = document.getElementById('modal-page-name');

            modalTitle.innerText = page.name;
            modalBody.innerHTML = '';

            if (page.additions && page.additions.length > 0) {
                const addSection = document.createElement('div');
                addSection.className = 'diff-section diff-add';
                addSection.innerHTML = '<h3>✅ Aggiunte e Modifiche</h3>';
                page.additions.forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'diff-item item-add';
                    item.innerText = text;
                    addSection.appendChild(item);
                });
                modalBody.appendChild(addSection);
            }

            if (page.removals && page.removals.length > 0) {
                const remSection = document.createElement('div');
                remSection.className = 'diff-section diff-rem';
                remSection.innerHTML = '<h3>❌ Rimozioni</h3>';
                page.removals.forEach(text => {
                    const item = document.createElement('div');
                    item.className = 'diff-item item-rem';
                    item.innerText = text;
                    remSection.appendChild(item);
                });
                modalBody.appendChild(remSection);
            }

            modalOverlay.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('close-modal').onclick = closeModal;
        document.getElementById('modal-overlay').onclick = (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        };

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Carica subito e poi ogni 60 secondi
        fetchStatus();
        setInterval(fetchStatus, 60000);
    </script>
</body>
</html>
